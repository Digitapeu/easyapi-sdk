  - target: '$.paths.*.get'
    description: 'Retry reads on throttling and transient upstream failures; the SDK honors Retry-After automatically'
    update:
      x-speakeasy-retries:
        strategy: backoff
        backoff:
          initialInterval: 500
          maxInterval: 30000
          maxElapsedTime: 60000
          exponent: 1.5
        statusCodes:
          - '429'
          - '502'
          - '503'
          - '504'
        retryConnectionErrors: true
  - target: '$.components'
    description: 'Shared error envelope schemas so the generator emits one typed error class per status'
    update:
      schemas:
        ErrorBody:
          title: ErrorBody
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable machine-readable error code.
            message:
              type: string
              description: Human-readable message.
              x-speakeasy-error-message: true
            details:
              type: object
              additionalProperties: true
        BadRequestError:
          title: BadRequestError
          description: HTTP 400 error envelope.
          type: object
          required: [error]
          properties:
            error:
              $ref: '#/components/schemas/ErrorBody'
        UnauthorizedError:
          title: UnauthorizedError
          description: HTTP 401 error envelope.
          type: object
          required: [error]
          properties:
            error:
              $ref: '#/components/schemas/ErrorBody'
        ForbiddenError:
          title: ForbiddenError
          description: HTTP 403 error envelope.
          type: object
          required: [error]
          properties:
            error:
              $ref: '#/components/schemas/ErrorBody'
        NotFoundError:
          title: NotFoundError
          description: HTTP 404 error envelope.
          type: object
          required: [error]
          properties:
            error:
              $ref: '#/components/schemas/ErrorBody'
        ConflictError:
          title: ConflictError
          description: HTTP 409 error envelope.
          type: object
          required: [error]
          properties:
            error:
              $ref: '#/components/schemas/ErrorBody'
        RateLimitedError:
          title: RateLimitedError
          description: HTTP 429 error envelope.
          type: object
          required: [error]
          properties:
            error:
              $ref: '#/components/schemas/ErrorBody'
        InternalServerError:
          title: InternalServerError
          description: HTTP 500 error envelope.
          type: object
          required: [error]
          properties:
            error:
              $ref: '#/components/schemas/ErrorBody'
        NotImplementedError:
          title: NotImplementedError
          description: HTTP 501 error envelope.
          type: object
          required: [error]
          properties:
            error:
              $ref: '#/components/schemas/ErrorBody'
        BadGatewayError:
          title: BadGatewayError
          description: HTTP 502 error envelope.
          type: object
          required: [error]
          properties:
            error:
              $ref: '#/components/schemas/ErrorBody'
        ServiceUnavailableError:
          title: ServiceUnavailableError
          description: HTTP 503 error envelope.
