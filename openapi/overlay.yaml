overlay: 1.0.0
info:
  title: easyapi SDK overlay
  version: 1.0.0
actions:
  - target: '$.servers'
    description: 'Replace the placeholder server with production'
    remove: true
  - target: '$'
    description: 'Production server and global tags'
    update:
      servers:
        - url: https://easyapi.ro
          description: Production
      tags:
        - name: health
          description: 'Service reachability (database, Redis, ANAF).'
        - name: me
          description: 'The calling business: tier, scopes and limits.'
        - name: company
          description: 'Company identity, VAT status, balance sheets and litigation by CUI.'
        - name: vat
          description: 'EU VAT number validation through VIES.'
        - name: fx
          description: 'BNR reference exchange rates and conversion.'
        - name: justice
          description: 'ECRIS courts, court cases, hearings and the litigation change feed.'
        - name: legislation
          description: 'Parliamentary bills, consolidated acts and Monitorul Oficial.'
        - name: search
          description: 'Company name search.'
        - name: connections
          description: 'Gov connections (ANAF, REGES, bank) a tenant has authorized.'
        - name: efactura
          description: 'e-Factura invoice upload, clearance state, downloads and validation.'
        - name: etransport
          description: 'e-Transport declarations.'
        - name: reges
          description: 'REGES employment contracts, async jobs and employees.'
        - name: bank
          description: 'IBAN lookup and open-banking accounts, balances and transactions.'
        - name: procurement
          description: 'Public procurement contracts, tenders, direct purchases and CPV analysis.'
        - name: spv
          description: 'SPV inbox messages, documents and the e-TVA return.'
        - name: geo
          description: 'Cadastral parcel lookup.'
        - name: stats
          description: 'TEMPO statistical matrices.'
        - name: auth
          description: 'DPoP machine-credential enrollment and token exchange (handled by the SDK session layer).'
  - target: '$.components.securitySchemes.dpop'
    description: 'DPoP is applied at runtime by an SDK hook, not by the generator'
    remove: true
  - target: '$.paths.*.*.security[?(@.dpop)]'
    description: 'Drop the DPoP alternative from every operation security requirement'
    remove: true
  - target: '$.paths.*.*.parameters[?(@.name==''DPoP'')]'
    description: 'The DPoP proof header is set by the SDK hook, not by callers'
    remove: true
  - target: '$.paths[''/v1/search''].get.responses[''200''].content[''application/json''].schema.properties.data.not'
    description: 'The always-501 search endpoint declares a never-matching 200 body, which the generator cannot model; leave the body untyped'
    remove: true
  - target: '$.paths[''/oauth/sdk/token''].post'
    description: 'Machine-auth operation: called by the SDK DPoP session layer, not exposed'
    update:
      x-speakeasy-ignore: true
  - target: '$.paths[''/v1/auth/credentials/{credentialId}/rotate''].post'
    description: 'Machine-auth operation: called by the SDK DPoP session layer, not exposed'
    update:
      x-speakeasy-ignore: true
  - target: '$.paths[''/v1/auth/enroll''].post'
    description: 'Machine-auth operation: called by the SDK DPoP session layer, not exposed'
    update:
      x-speakeasy-ignore: true
